services:
  - type: web
    name: CDCNSA
    runtime: python
    buildCommand: pip install -r requirements.txt && python download_models.py
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GROQ_API_KEY
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: QWEN_VL_MODEL
        value: qwen3-vl-plus
      - key: QWEN_VL_BASE_URL
        value: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      - key: PORT
        value: 10000
      - key: CDCNSA_MAX_CACHED_MODELS
        value: 1
      - key: CDCNSA_CPU_HALF
        value: 1
