<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #0A0F1C;
    font-family: 'Manrope', sans-serif;
    gap: 40px;
  }
  .logo-container {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .brand-mark {
    width: 80px;
    height: 80px;
    min-width: 80px;
    border: 1px solid rgba(34,197,94,0.3);
    border-radius: 16px;
    background: rgba(34,197,94,0.15);
    display: grid;
    place-items: center;
  }
  .brand-mark svg {
    width: 52px;
    height: 52px;
  }
  .brand-text strong {
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #F8FAFC;
  }
  .brand-text small {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.13em;
    color: #94A3B8;
    margin-top: 4px;
    display: block;
  }
  .standalone {
    width: 200px;
    height: 200px;
    border: 1px solid rgba(34,197,94,0.3);
    border-radius: 32px;
    background: rgba(34,197,94,0.15);
    display: grid;
    place-items: center;
  }
  .standalone svg {
    width: 140px;
    height: 140px;
  }
  .label {
    color: #64748B;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
  <div class="label">Sidebar logo</div>
  <div class="logo-container">
    <div class="brand-mark">
      <svg viewBox="0 0 48 48" role="img">
        <defs>
          <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#22C55E;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#16A34A;stop-opacity:1" />
          </linearGradient>
        </defs>
        <path d="M14 34c0-12 8-20 20-22-2 14-10 22-20 22z" fill="url(#leafGrad)" opacity="0.9"/>
        <path d="M16 32c4-8 10-14 16-16" stroke="#22C55E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <circle cx="20" cy="28" r="1.5" fill="#22C55E"/>
        <circle cx="24" cy="24" r="1.5" fill="#22C55E"/>
        <circle cx="28" cy="20" r="1.5" fill="#22C55E"/>
        <path d="M20 28l4-4m0 0l4-4" stroke="#22C55E" stroke-width="1" opacity="0.6"/>
      </svg>
    </div>
    <div class="brand-text">
      <strong>CCNSA</strong>
      <small>Crop Health Assistant</small>
    </div>
  </div>

  <div class="label" style="margin-top:40px">Standalone large preview</div>
  <div class="standalone">
    <svg viewBox="0 0 48 48" role="img">
      <defs>
        <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#22C55E;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#16A34A;stop-opacity:1" />
        </linearGradient>
      </defs>
      <path d="M14 34c0-12 8-20 20-22-2 14-10 22-20 22z" fill="url(#leafGrad2)" opacity="0.9"/>
      <path d="M16 32c4-8 10-14 16-16" stroke="#22C55E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <circle cx="20" cy="28" r="1.5" fill="#22C55E"/>
      <circle cx="24" cy="24" r="1.5" fill="#22C55E"/>
      <circle cx="28" cy="20" r="1.5" fill="#22C55E"/>
      <path d="M20 28l4-4m0 0l4-4" stroke="#22C55E" stroke-width="1" opacity="0.6"/>
    </svg>
  </div>
</body>
</html>
